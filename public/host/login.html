<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호스트 로그인 - Secret Santa Matcher</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/loading.js"></script>
  <script src="/assets/js/host-login.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🎯 호스트 로그인</h1>

    <!-- 메시지 영역 -->
    <div id="message" class="message hidden"></div>

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <div class="form-group">
        <label for="hostId">호스트 ID</label>
        <input
          type="text"
          id="hostId"
          placeholder="호스트 ID를 입력하세요"
          autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password">
      </div>

      <button class="btn btn-primary">
        로그인
      </button>

      <a href="#" class="link">
        처음이신가요? 회원가입하기
      </a>

      <a href="/" class="link">
        메인으로 돌아가기
      </a>
    </div>

    <!-- 회원가입 폼 -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label for="newHostId">호스트 ID</label>
        <input
          type="text"
          id="newHostId"
          placeholder="사용할 ID를 입력하세요"
          autocomplete="username">
        <small style="color: #888;">영문, 숫자 조합 권장</small>
      </div>

      <div class="form-group">
        <label for="newPassword">비밀번호</label>
        <input
          type="password"
          id="newPassword"
          placeholder="비밀번호 (6자 이상)"
          autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">비밀번호 확인</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="비밀번호를 다시 입력하세요"
          autocomplete="new-password">
      </div>

      <button class="btn btn-primary">
        회원가입
      </button>

      <a href="#" class="link">
        이미 계정이 있으신가요? 로그인하기
      </a>
    </div>
  </div>

</body>
</html>
