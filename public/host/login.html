<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호스트 로그인 - Secret Santa Matcher</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="container">
    <h1>🎯 호스트 로그인</h1>

    <!-- 메시지 영역 -->
    <div id="message" class="message hidden"></div>

    <!-- 로그인 폼 -->
    <div id="loginForm">
      <div class="form-group">
        <label for="hostId">호스트 ID</label>
        <input
          type="text"
          id="hostId"
          placeholder="호스트 ID를 입력하세요"
          autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password">
      </div>

      <button class="btn btn-primary" onclick="login()">
        로그인
      </button>

      <a href="#" class="link" onclick="showRegisterForm(); return false;">
        처음이신가요? 회원가입하기
      </a>

      <a href="/" class="link">
        메인으로 돌아가기
      </a>
    </div>

    <!-- 회원가입 폼 -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label for="newHostId">호스트 ID</label>
        <input
          type="text"
          id="newHostId"
          placeholder="사용할 ID를 입력하세요"
          autocomplete="username">
        <small style="color: #888;">영문, 숫자 조합 권장</small>
      </div>

      <div class="form-group">
        <label for="newPassword">비밀번호</label>
        <input
          type="password"
          id="newPassword"
          placeholder="비밀번호 (6자 이상)"
          autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">비밀번호 확인</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="비밀번호를 다시 입력하세요"
          autocomplete="new-password">
      </div>

      <button class="btn btn-primary" onclick="register()">
        회원가입
      </button>

      <a href="#" class="link" onclick="showLoginForm(); return false;">
        이미 계정이 있으신가요? 로그인하기
      </a>
    </div>
  </div>

  <script>
    // 폼 전환
    function showRegisterForm() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('message').classList.add('hidden');
    }

    function showLoginForm() {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('message').classList.add('hidden');
    }

    // 메시지 표시
    function showMessage(text, type = 'error') {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message message-${type}`;
      messageEl.classList.remove('hidden');
    }

    // 로그인
    async function login() {
      const hostId = document.getElementById('hostId').value.trim();
      const password = document.getElementById('password').value;

      if (!hostId || !password) {
        showMessage('ID와 비밀번호를 입력해주세요.');
        return;
      }

      try {
        const response = await fetch('/api/host/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ hostId, password }),
        });

        const data = await response.json();

        if (data.success) {
          // 로그인 성공 - 호스트 ID를 세션 스토리지에 저장
          sessionStorage.setItem('hostId', data.hostId);
          showMessage('로그인 성공! 대시보드로 이동합니다...', 'success');
          setTimeout(() => {
            window.location.href = '/host/dashboard';
          }, 1000);
        } else {
          showMessage(data.message);
        }
      } catch (error) {
        console.error('Login error:', error);
        showMessage('로그인 중 오류가 발생했습니다.');
      }
    }

    // 회원가입
    async function register() {
      const hostId = document.getElementById('newHostId').value.trim();
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!hostId || !password || !confirmPassword) {
        showMessage('모든 필드를 입력해주세요.');
        return;
      }

      if (password.length < 6) {
        showMessage('비밀번호는 6자 이상이어야 합니다.');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('비밀번호가 일치하지 않습니다.');
        return;
      }

      try {
        const response = await fetch('/api/host/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ hostId, password }),
        });

        const data = await response.json();

        if (data.success) {
          showMessage('회원가입 성공! 로그인해주세요.', 'success');
          setTimeout(() => {
            showLoginForm();
            document.getElementById('hostId').value = hostId;
          }, 1500);
        } else {
          showMessage(data.message);
        }
      } catch (error) {
        console.error('Register error:', error);
        showMessage('회원가입 중 오류가 발생했습니다.');
      }
    }

    // 엔터 키 이벤트
    document.addEventListener('DOMContentLoaded', () => {
      // 로그인 폼
      document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
      });

      // 회원가입 폼
      document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') register();
      });
    });
  </script>
</body>
</html>
