<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#667eea">
  <title>호스트 대시보드 - Secret Santa Matcher</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/loading.js"></script>
  <script src="/assets/js/host-dashboard.js" defer></script>
  <style>
    body {
      align-items: flex-start;
      padding-top: 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      text-align: left;
    }

    .logout-btn {
      padding: 10px 20px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="container container-wide">
    <div class="header">
      <div>
        <h1>🎯 호스트 대시보드</h1>
        <p style="color: #888;">환영합니다, <span id="hostIdDisplay"></span>님!</p>
      </div>
      <button class="logout-btn">로그아웃</button>
    </div>

    <!-- 메시지 영역 -->
    <div id="message" class="message hidden"></div>

    <!-- 새 모임 생성 -->
    <div style="margin-bottom: 40px; background: #f9f9f9; padding: 25px; border-radius: 10px;">
      <h2>➕ 새 모임 만들기</h2>
      <div class="form-group">
        <label for="meetingTitle">모임 제목</label>
        <input
          type="text"
          id="meetingTitle"
          placeholder="예: 2025 송년회 마니또">
      </div>
      <div class="form-group">
        <label for="maxParticipants">최대 참가자 수</label>
        <input
          type="number"
          id="maxParticipants"
          value="50"
          min="2"
          max="100">
      </div>

      <!-- 호스트 참여 방식 선택 -->
      <div class="form-group">
        <label style="display: flex; align-items: center; cursor: pointer;">
          <input
            type="checkbox"
            id="hostJoinsAsParticipant"
            style="margin-right: 10px; width: auto;">
          게스트로도 참여하기 (마니또 매칭에 참여)
        </label>
        <small style="color: #888; display: block; margin-top: 5px;">
          체크 시 호스트도 참가자로 등록되어 마니또 매칭에 포함됩니다.
        </small>
      </div>

      <!-- 호스트 참가자 정보 (조건부 표시) -->
      <div id="hostParticipantFields" class="hidden" style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin-top: 15px;">
        <h3 style="margin-bottom: 15px; font-size: 16px; color: #1976d2;">👤 호스트 참가자 정보</h3>
        <div class="form-group">
          <label for="hostParticipantName">참가자 이름</label>
          <input
            type="text"
            id="hostParticipantName"
            placeholder="다른 참가자들에게 표시될 이름"
            maxlength="20">
        </div>
        <div class="form-group">
          <label for="hostPassword">비밀번호</label>
          <input
            type="password"
            id="hostPassword"
            placeholder="참가자 화면 접속 시 사용할 비밀번호"
            minlength="4">
        </div>
        <div class="form-group">
          <label for="hostParticipantMessage">방명록 (선택사항)</label>
          <textarea
            id="hostParticipantMessage"
            placeholder="방명록 메시지"
            maxlength="200"></textarea>
        </div>
      </div>

      <button class="btn btn-primary" data-action="create-meeting">
        모임 생성하기
      </button>
    </div>

    <!-- 모임 목록 -->
    <div>
      <h2>📋 내 모임 목록</h2>
      <div id="meetingsList">
        <div class="loading">모임 목록을 불러오는 중...</div>
      </div>
    </div>

  </div>

</body>
</html>
