<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모임 참가 - Secret Santa Matcher</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/loading.js"></script>
  <script src="/assets/js/participant-join.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🎉 모임 참가하기</h1>

    <!-- 메시지 영역 -->
    <div id="message" class="message hidden"></div>

    <!-- 로딩 상태 -->
    <div id="loadingState">
      <div class="loading">모임 정보를 불러오는 중...</div>
    </div>

    <!-- 모임 정보 -->
    <div id="meetingInfo" class="hidden">
      <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 25px;">
        <h2 id="meetingTitle" style="margin-bottom: 10px;"></h2>
        <p style="color: #666;">
          <span id="participantCount">0</span>명이 참가 중입니다
        </p>
      </div>

      <!-- 로그인/회원가입 폼 -->
      <div id="authForm" class="hidden">
        <!-- 1단계: 이름 입력 -->
        <div id="nameStep">
          <div class="form-group">
            <label for="participantName">참가자 이름</label>
            <input
              type="text"
              id="participantName"
              placeholder="이름 또는 닉네임을 입력하세요"
              maxlength="20">
            <small style="color: #888;">다른 참가자와 중복되지 않는 이름을 입력하세요</small>
          </div>
          <button class="btn btn-primary" data-action="check-name">
            다음
          </button>
        </div>

        <!-- 2단계: 비밀번호 입력 (신규/기존 구분) -->
        <div id="passwordStep" class="hidden">
          <p style="margin-bottom: 20px; color: #666;">
            <strong id="selectedName"></strong>님, 환영합니다!
          </p>

          <!-- 신규 사용자 -->
          <div id="signupForm" class="hidden">
            <p style="color: #2e7d32; margin-bottom: 15px;">
              ✨ 새로운 참가자입니다. 비밀번호를 설정해주세요.
            </p>
            <div class="form-group">
              <label for="newPassword">비밀번호 설정</label>
              <input
                type="password"
                id="newPassword"
                placeholder="최소 4자 이상"
                minlength="4">
            </div>
            <div class="form-group">
              <label for="confirmPassword">비밀번호 확인</label>
              <input
                type="password"
                id="confirmPassword"
                placeholder="비밀번호를 다시 입력하세요"
                minlength="4">
            </div>
            <button class="btn btn-primary" data-action="signup">
              참가하기
            </button>
          </div>

          <!-- 기존 사용자 -->
          <div id="loginForm" class="hidden">
            <p style="color: #1976d2; margin-bottom: 15px;">
              👋 기존 참가자입니다. 비밀번호를 입력해주세요.
            </p>
            <div class="form-group">
              <label for="password">비밀번호</label>
              <input
                type="password"
                id="password"
                placeholder="비밀번호를 입력하세요">
            </div>
            <button class="btn btn-primary" data-action="login">
              로그인
            </button>
          </div>

          <button class="btn btn-secondary" data-action="go-back" style="margin-top: 10px;">
            ← 이름 다시 입력
          </button>
        </div>
      </div>

      <!-- 참가 완료 화면 -->
      <div id="joinedView" class="hidden">
        <div style="background: #e8f5e9; padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: center;">
          <h3 style="color: #2e7d32; margin-bottom: 10px;">✅ 로그인 완료!</h3>
          <p style="color: #666;">환영합니다, <strong id="myName"></strong>님!</p>
        </div>

        <!-- 내 방명록 -->
        <div style="background: #f3e5f5; padding: 20px; border-radius: 10px; margin-bottom: 25px;">
          <h3 style="color: #6a1b9a; margin-bottom: 15px;">💌 내 방명록</h3>
          <div id="guestbookView">
            <p id="currentMessage" style="padding: 15px; background: white; border-radius: 8px; margin-bottom: 15px;"></p>
            <button class="btn btn-secondary" data-action="edit-guestbook">
              방명록 수정하기
            </button>
          </div>
          <div id="guestbookEdit" class="hidden">
            <div class="form-group">
              <textarea
                id="editMessage"
                placeholder="호스트에게 남길 메시지를 작성하세요"
                maxlength="200"
                style="min-height: 100px;"></textarea>
            </div>
            <button class="btn btn-primary" data-action="update-guestbook">
              저장하기
            </button>
            <button class="btn btn-secondary" data-action="cancel-edit-guestbook" style="margin-top: 10px;">
              취소
            </button>
          </div>
        </div>

        <!-- 마니또 결과 확인 -->
        <div style="background: #fff3e0; padding: 20px; border-radius: 10px; margin-bottom: 25px;">
          <h3 style="color: #e65100; margin-bottom: 15px;">🎁 내 마니또</h3>
          <div id="manittoResult">
            <p style="color: #888; text-align: center;">호스트가 매칭을 진행하면 여기에 표시됩니다.</p>
          </div>
          <button class="btn btn-secondary" data-action="check-manitto">
            마니또 확인하기
          </button>
        </div>

        <!-- 날짜 투표 -->
        <div id="dateVotingSection" style="background: #e3f2fd; padding: 20px; border-radius: 10px; margin-bottom: 25px; display: none;">
          <h3 style="color: #1976d2; margin-bottom: 15px;">📅 모임 날짜 투표</h3>
          <p style="color: #666; font-size: 14px; margin-bottom: 15px;">모임 날짜를 투표해주세요!</p>
          <button class="btn btn-primary" data-action="show-date-voting">
            날짜 투표하기
          </button>
        </div>

        <!-- 모임 나가기 -->
        <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #ddd;">
          <button class="btn btn-danger" data-action="leave-meeting" style="background: #dc3545;">
            🚪 모임 나가기
          </button>
          <p style="color: #888; font-size: 12px; margin-top: 10px;">모임에서 나가면 다시 참가할 수 있습니다.</p>
        </div>
      </div>

      <!-- 실시간 참가자 목록 -->
      <div style="margin-top: 30px;">
        <h3 style="margin-bottom: 15px;">👥 참가자 목록</h3>
        <ul id="participantList" class="participant-list">
          <li class="loading">참가자 목록을 불러오는 중...</li>
        </ul>
        <button class="btn btn-secondary btn-small" data-action="refresh-participants" style="width: 100%;">
          🔄 새로고침
        </button>
      </div>
    </div>

    <a href="/" class="link">메인으로 돌아가기</a>
  </div>
</body>
</html>
